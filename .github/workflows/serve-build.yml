name: Serve build workspace

# Starts an HTTP build service on the runner, reachable only over Tailscale.
# The caller uploads a source zip, asks for a build, polls status, then
# downloads the artifact file. No GitHub artifacts are produced.

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Short id; the runner joins as rb-<id>"
        required: true
      token:
        description: "Access token for the HTTP API"
        required: true
      plat:
        description: "Runner image: ubuntu-latest, windows-latest, macos-latest"
        required: false
        default: "ubuntu-latest"
      port:
        description: "HTTP port"
        required: false
        default: "8787"
      build_command:
        description: "Default build command"
        required: false
        default: "cargo build --release"
      timeout:
        description: "Per-build timeout in seconds"
        required: false
        default: "3600"
      max_lifetime:
        description: "Server lifetime in seconds"
        required: false
        default: "7200"

jobs:
  serve:
    runs-on: ${{ inputs.plat }}
    timeout-minutes: 180
    steps:
      - name: Tailscale connect
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --hostname=rb-${{ inputs.build_id }}

      - uses: actions/checkout@v4

      # Compile cache across ephemeral runners: sccache stores rustc outputs in
      # the GitHub Actions cache, so a second build of the same crates is fast
      # even though the runner's disk starts empty.
      - name: Rust compile cache (sccache)
        uses: mozilla-actions/sccache-action@v0.0.11

      # Cargo registry/git cache: avoids re-downloading the same crates. The
      # source is uploaded after this step, so the key cannot hash Cargo.lock;
      # a run-id key with a stable restore prefix keeps the newest cache.
      - name: Cargo registry cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      # Only the Linux image needs extra packages; Windows and macOS ship a
      # Rust toolchain that builds natively.
      - name: Toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu

      - name: Serve
        shell: bash
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        run: |
          IP="$(tailscale ip -4 | head -1)"
          echo "tailnet address: $IP"
          PY=python3
          if [ "$RUNNER_OS" = "Windows" ]; then PY=python; fi
          "$PY" remote_build_ws.py \
            --host "$IP" \
            --port "${{ inputs.port }}" \
            --token "${{ inputs.token }}" \
            --root "${{ github.workspace }}/ws" \
            --build-dir src \
            --build-command "${{ inputs.build_command }}" \
            --timeout "${{ inputs.timeout }}" \
            --max-lifetime "${{ inputs.max_lifetime }}"
