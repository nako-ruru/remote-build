name: Remote Build (white-pick runner)

# Only mode: pull code from your machine via Tailscale + rsync,
# build on GitHub runner, push artifact back to your machine.
# Trigger:
#   gh workflow run remote-build.yml -R nako-ruru/remote-build \
#     -f source_host=my-pc -f source_root=D:/projects/myrust \
#     -f return_path=D:/projects/myrust/out

on:
  workflow_dispatch:
    inputs:
      source_host:
        description: "Tailscale hostname/IP of your machine (pull source + receive artifact)"
        required: true
        default: ""
      source_root:
        description: "Absolute path on your machine to the project"
        required: true
        default: ""
      build_command:
        description: "Command to run inside the project directory"
        required: false
        default: "cargo build --release"
      artifact_path:
        description: "Artifact glob to copy back (relative to project dir)"
        required: false
        default: "target/release/*"
      toolchain:
        description: "Toolchain: rust | go | cpp | node | none"
        required: false
        default: "rust"
      return_path:
        description: "Local directory on your machine to receive the built artifact"
        required: true
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Tailscale connect
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Setup SSH key
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.LOCAL_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ inputs.source_host }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Pull code from local machine
        run: |
          set -e
          rm -rf project && mkdir -p project
          rsync -avz --delete "${{ inputs.source_host }}:${{ inputs.source_root }}/" ./project/
          echo "--- pulled tree ---"
          ls -la ./project

      - name: Setup Rust
        if: ${{ inputs.toolchain == 'rust' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        if: ${{ inputs.toolchain == 'go' }}
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Setup Node
        if: ${{ inputs.toolchain == 'node' }}
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup C/C++
        if: ${{ inputs.toolchain == 'cpp' }}
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build

      - name: Build
        working-directory: ./project
        run: ${{ inputs.build_command }}

      - name: Return artifact to local machine
        run: |
          set -e
          cd ./project
          shopt -s nullglob
          files=( ${{ inputs.artifact_path }} )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No files matched artifact_path: ${{ inputs.artifact_path }}" >&2
            exit 1
          fi
          ssh "${{ inputs.source_host }}" "mkdir -p '${{ inputs.return_path }}'"
          for f in "${files[@]}"; do
            scp -r "$f" "${{ inputs.source_host }}:${{ inputs.return_path }}/"
          done
          echo "Returned to ${{ inputs.source_host }}:${{ inputs.return_path }}"

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.run_number }}
          path: ./project/${{ inputs.artifact_path }}
          retention-days: 7
          if-no-files-found: warn
