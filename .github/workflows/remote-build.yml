name: Remote Build (white-pick runner)

# Pull code from your machine via Tailscale + compressed ssh tar pipe,
# build on GitHub runner, push artifact back to your machine.
# Runs on ubuntu-latest => produces Linux binaries by default.
# Cross-compile: set `target` (e.g. x86_64-pc-windows-gnu needs mingw;
# macOS targets need osxcross and are not supported out of the box).

on:
  workflow_dispatch:
    inputs:
      source_host:
        description: "Tailscale hostname/IP of your machine"
        required: true
        default: ""
      source_root:
        description: "Absolute path on your machine to the project"
        required: true
        default: ""
      build_command:
        description: "Command to run inside the project directory"
        required: false
        default: "cargo build --release"
      target:
        description: "Rust target triple (default linux). Cross-compile needs extra toolchain."
        required: false
        default: "x86_64-unknown-linux-gnu"
      artifact_path:
        description: "Artifact glob to copy back (relative to project dir). Update if you change target."
        required: false
        default: "target/x86_64-unknown-linux-gnu/release/*"
      toolchain:
        description: "Toolchain: rust | go | cpp | node | none"
        required: false
        default: "rust"
      return_path:
        description: "Local directory on your machine to receive the built artifact"
        required: true
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Tailscale connect
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Setup SSH key
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.LOCAL_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ inputs.source_host }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Pull code (compressed ssh tar pipe)
        run: |
          set -e
          rm -rf project && mkdir -p project
          ssh "${{ inputs.source_host }}" "tar czf - --exclude=.git --exclude=target --exclude=node_modules -C '${{ inputs.source_root }}' ." | tar xzf - -C ./project
          echo "--- pulled tree ---"
          ls -la ./project

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ./project/target
            ./project/opencalc-live/target
          key: ${{ runner.os }}-cargo-${{ inputs.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ inputs.target }}-

      - name: Setup Rust
        if: ${{ inputs.toolchain == 'rust' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target }}

      - name: Setup Go
        if: ${{ inputs.toolchain == 'go' }}
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Setup Node
        if: ${{ inputs.toolchain == 'node' }}
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup C/C++
        if: ${{ inputs.toolchain == 'cpp' }}
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build

      - name: Build
        working-directory: ./project
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          CARGO_TARGET_DIR: target
          CARGO_BUILD_TARGET: ${{ inputs.target }}
        run: |
          set -e
          # install mold if missing
          if ! command -v mold >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y mold
          fi
          ${{ inputs.build_command }}

      - name: Return artifact to local machine
        run: |
          set -e
          cd ./project
          shopt -s nullglob
          files=( ${{ inputs.artifact_path }} )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No files matched: ${{ inputs.artifact_path }}" >&2
            exit 1
          fi
          ssh "${{ inputs.source_host }}" "mkdir -p '${{ inputs.return_path }}'"
          for f in "${files[@]}"; do
            scp -r "$f" "${{ inputs.source_host }}:${{ inputs.return_path }}/"
          done
          echo "Returned to ${{ inputs.source_host }}:${{ inputs.return_path }}"

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.run_number }}
          path: ./project/${{ inputs.artifact_path }}
          retention-days: 7
          if-no-files-found: warn
